# .github/workflows/databricks_pipeline.yml

name: Databricks CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  # 1. Continuous Integration (CI) - This job stays the same
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      # ... (no changes here) ...

  # 2. Deploy and Run on DEV Environment (The New Way)
  run-on-dev:
    needs: ci-checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DEV Job on Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          # The only command you need now! Replace with your DEV Job ID.
          databricks jobs run-now --job-id 1008934614204806

 